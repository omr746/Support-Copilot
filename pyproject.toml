[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "support-copilot"
version = "0.1.0"
description = "Production AI customer-support assistant (RAG + agent + voice, Arabic and English)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "httpx>=0.27",
    "openai>=1.54",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
local-asr = ["faster-whisper>=1.0"]
local-tts = []
evals    = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "anyio[trio]>=4.6",
    "mypy>=1.13",
    "ruff>=0.7",
    "import-linter>=2.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/copilot"]

[tool.pytest.ini_options]
testpaths    = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: calls a real provider API — never run in CI. Requires COPILOT_RUN_LIVE=1.",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length    = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "PIE", "T20", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["copilot"]

[tool.mypy]
python_version    = "3.12"
warn_return_any   = true
warn_unused_configs = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
module = ["yaml", "structlog", "openai.*"]
ignore_missing_imports = true