name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --group dev

      - name: Docs check (LOG.md and docs/adr)
        run: uv run python scripts/check_docs.py

      - name: ADR check (Status, Context, Decision, numbering)
        run: uv run python scripts/check_adrs.py

      - name: Format check (ruff format)
        run: uv run ruff format --check src tests scripts

      - name: Lint check (ruff check)
        run: uv run ruff check src tests scripts

      - name: Type check (mypy)
        run: uv run mypy src

      - name: Import boundary check (import-linter)
        run: uv run lint-imports

      - name: Unit tests (live tests are excluded)
        run: uv run pytest tests/unit -q -m "not live"

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Run Docker and Docker Compose verification
        run: bash scripts/check_docker.sh
